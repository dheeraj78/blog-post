<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor || Blog post card</title>
    <!-- css file link-->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- main card container -->
    <div class="card flexcolumn">
        <!-- image container -->
        <div class="image-container">
            <img src="assets/images/Blog Image.svg" class="hero-image" alt="Block post image">
        </div>

        <!-- main content container -->
        <div id="main-contents" class="flexcolumn">
            <button id="status" tabindex="1">Learning</button>
            <p class="date-time">Published 21 Dec 2023</p>
            <h1 class="main-heading">HTML & CSS foundations</h1>
            <p class="content">
                These languages are the backbone of every website, defining structure, content, and presentation.
            </p>
        </div>

        <!-- publisher profile and name container start -->
        <div class="author">
            <div class="profile-img">
                <img src="assets/images/userpic.svg" alt="user profile image">
            </div>
            <p class="author-name">Greg Hooper</p>
        </div>
    </div>
</body>
</html>
